# Housemate: the Ingress port, in front of code-server. See the nginx service.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 1337 default_server;
        server_name _;

        include /run/housemate-nginx-allow.conf;

        # The reconnect helper (see reconnect.js): served from here and added to
        # the editor's page, so that nothing in code-server itself is patched.
        location = /_housemate/boot {
            alias /run/housemate-boot-id;
            default_type text/plain;
            add_header Cache-Control "no-store";
        }

        location = /_housemate/reconnect.js {
            alias /usr/share/housemate/web/reconnect.js;
            default_type application/javascript;
            add_header Cache-Control "no-store";
        }

        # Only the editor's own page gets the helper, uncompressed so that
        # sub_filter can read it; everything else (the large scripts) passes as is.
        location = / {
            include /etc/nginx/housemate-proxy.conf;
            proxy_set_header Accept-Encoding "";
            # Under Ingress the page's own address has no trailing slash, so a relative
            # URL would miss; the Supervisor says where the panel lives in X-Ingress-Path.
            sub_filter '</head>' '<script src="$http_x_ingress_path/_housemate/reconnect.js"></script></head>';
            sub_filter_once on;
            proxy_pass http://127.0.0.1:1338;
        }

        location / {
            include /etc/nginx/housemate-proxy.conf;
            proxy_pass http://127.0.0.1:1338;
        }
    }
}
