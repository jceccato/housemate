blueprint:
  name: Housemate voice kick-off
  description: >-
    Say "Housemate, build me ..." to Assist (or the name you chose) and Housemate
    starts a job in its chat. A notification on your phone opens it, and tells you when the job
    needs an answer or is done. A request from someone who is not a Home
    Assistant administrator waits in the chat for an administrator.
  domain: automation
  source_url: https://github.com/jceccato/housemate/blob/main/housemate_edge/rootfs/usr/share/housemate/voice/voice_kickoff.yaml
  input:
    notify_service:
      name: Phone to notify
      description: >-
        The notify service of the phone that should hear about jobs, for
        example notify.mobile_app_my_phone (Developer tools, Actions, lists
        them). Leave empty to use persistent notifications only.
      default: ""
      selector:
        text:
    phrases:
      name: What to say
      description: >-
        The sentences that start a job, with {request} for the rest of what you
        say. The first words are the name you call Housemate by. Change it by
        asking the agent, which keeps this list in step.
      default:
        - "Housemate {request}"
        - "Hey Housemate {request}"
      selector:
        text:
          multiple: true

# Needs the `rest_command.housemate_kickoff` action, which the add-on's
# `housemate-voice-install` script sets up with the blueprint.
triggers:
  - trigger: conversation
    command: !input phrases

actions:
  - action: rest_command.housemate_kickoff
    data:
      text: "{{ trigger.slots.request }}"
      user_id: >-
        {{ trigger.user_input.context.user_id
           if trigger.user_input is defined
              and trigger.user_input.context is defined
              and trigger.user_input.context.user_id
           else '' }}
      notify: !input notify_service
    response_variable: kickoff
  - set_conversation_response: >-
      {% if kickoff is defined and kickoff.status == 202 %}
        Okay, I've started that. I'll message you when it needs you or it is done.
      {% else %}
        Sorry, I couldn't start that. Housemate isn't answering.
      {% endif %}
mode: queued
