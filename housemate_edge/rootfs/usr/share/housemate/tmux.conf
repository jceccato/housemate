# tmux for housemate-agent only: it is there to keep OpenCode alive when the
# tab closes and to attach again, not to be seen. No status bar, no prefix.
set -g status off
set -g prefix None
unbind-key C-b
set -g mouse on
set -g escape-time 0
set -g history-limit 2000
set -g window-size latest
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm*:Tc"
