name: Publish edge

# Every merge to main that touches the edge add-on publishes a build, in this
# order, and the order is the point:
#
#   1. test        the same suite the pull request ran
#   2. plan        pick the version: the next one with no image yet
#   3. build       push both architectures' images, tagged with that version
#   4. release     only now tag the commit and write the version into
#                  housemate_edge/config.yaml with its CHANGELOG.md entry
#
# So the version the store shows never runs ahead of an image, and a tag is
# never overwritten (the plan skips versions that have images; the push skips
# a tag that exists). Nobody bumps the version or writes edge's changelog by
# hand: that is this workflow's job. A version someone did bump by hand, with
# no image yet, is published as it stands (and needs its own CHANGELOG entry).
#
# The bump commit says [skip ci], so it does not publish again. Publishes are
# serialised, so two merges cannot choose the same version.
#
# Needs the repository secret RELEASE_TOKEN once main is protected: a
# fine-grained token (contents: write) of a user allowed to bypass the ruleset.
# Until then the workflow's own token pushes.

on:
  push:
    branches: [main]
    paths:
      - "housemate_edge/**"
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: housemate-edge

permissions:
  contents: read

concurrency:
  group: publish-edge
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  plan:
    name: Plan the version
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      current: ${{ steps.plan.outputs.current }}
      bump: ${{ steps.plan.outputs.bump }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Choose the version
        id: plan
        run: python3 .github/scripts/release.py plan

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: plan
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Cosign signing
      packages: write # push to GitHub Container Registry
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build and push the image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: housemate_edge
          image: ${{ matrix.image }}
          image-tags: ${{ needs.plan.outputs.version }}
          version: ${{ needs.plan.outputs.version }}
          push: "true"
          skip-existing: ${{ needs.plan.outputs.version }}
          cache-gha-scope: housemate-edge
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Tag and bump the version
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CURRENT: ${{ needs.plan.outputs.current }}
      BUMP: ${{ needs.plan.outputs.bump }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Tag the built commit
        run: |
          # edge-<version> names the commit the images were built from; the
          # promotion workflow takes stable's files from it.
          git config user.name "housemate-pipeline"
          git config user.email "housemate-pipeline@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/edge-${VERSION}" >/dev/null; then
            [[ "$(git rev-parse "edge-${VERSION}^{commit}")" == "${GITHUB_SHA}" ]] \
              || { echo "::error::edge-${VERSION} already names a different commit; tags are never moved"; exit 1; }
          else
            git tag -a "edge-${VERSION}" "${GITHUB_SHA}" -m "Housemate (edge) ${VERSION}"
            git push origin "refs/tags/edge-${VERSION}"
          fi

      - name: Bump the version and the changelog
        if: env.BUMP == 'true'
        run: |
          python3 .github/scripts/release.py bump --version "${VERSION}" --until "${GITHUB_SHA}"
          if git diff --quiet; then
            echo "nothing to bump"
          else
            git add housemate_edge/config.yaml housemate_edge/CHANGELOG.md
            git commit -m "Bump edge to ${VERSION} [skip ci]" \
              -m "Published by the pipeline after both images were pushed. Built from ${GITHUB_SHA}."
            bash .github/scripts/push-main.sh
          fi
